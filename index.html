<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b2825" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="An interactive procedural koi pond with responsive fish, water ripples, changing weather, lotus leaves, and ambient river sound."
    />
    <script>
      (function () {
        window._pendingWallpaperProperties = null;
        window._pendingGeneralProperties = null;
        window._pendingWallpaperPaused = null;
        window._pendingLivelyProperties = [];

        window.wallpaperPropertyListener = {
          applyUserProperties: function (properties) {
            window._pendingWallpaperProperties = properties;
            if (typeof window._onWallpaperProperties === "function") {
              window._onWallpaperProperties(properties);
            }
          },
          applyGeneralProperties: function (properties) {
            window._pendingGeneralProperties = properties;
            if (typeof window._onGeneralProperties === "function") {
              window._onGeneralProperties(properties);
            }
          },
          setPaused: function (isPaused) {
            window._pendingWallpaperPaused = isPaused;
            if (typeof window._onWallpaperPaused === "function") {
              window._onWallpaperPaused(isPaused);
            }
          },
        };

        window.livelyPropertyListener = function (name, val) {
          if (typeof window._onLivelyProperty === "function") {
            window._onLivelyProperty(name, val);
          } else {
            window._pendingLivelyProperties.push({ name: name, val: val });
          }
        };
      })();
    </script>
    <title>Interactive Koi Pond</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main>
        <h1>Interactive Koi Pond</h1>
        <p>
          A relaxing procedural koi pond with responsive fish, water
          ripples, changing weather, lotus leaves, and ambient river sound.
          JavaScript is required to run the interactive pond.
        </p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
